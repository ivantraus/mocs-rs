[package]
name = "mocs-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Multi-objective evolutionary optimization, classification, and regression"
default-run = "mocs"
repository = "https://github.com/ivantraus/mocs-rs"
readme = "README.md"
include = [
    "/Cargo.toml", "/Cargo.lock", "/build.rs", "/rust-toolchain.toml",
    "/LICENSE", "/NOTICE", "/README.md", "/docs/**", "/src/**",
    "/benches/**", "/examples/**", "/tests/*.rs", "/tests/fixtures/**",
]

[lib]
name = "mocs_rs"

[[bin]]
name = "mocs"
path = "src/main.rs"

[[bench]]
name = "core"
harness = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "0.9"
rand = "0.9.5"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
sha2 = "0.10"
statrs = { version = "0.18", default-features = false }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = "1.9"

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"
